<mat-toolbar class="primary-toolbar">
  <button
    matIconButton
    aria-label="Example icon-button with heart icon"
    (click)="sidebarOpen.set(!sidebarOpen())"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <span>Kakera</span>
  <span class="w-full"></span>
  <button matIconButton aria-label="Example icon-button with heart icon">
    <mat-icon>favorite</mat-icon>
  </button>
  <button matIconButton aria-label="Example icon-button with share icon">
    <mat-icon>share</mat-icon>
  </button>
</mat-toolbar>

<mat-drawer-container>
  <mat-drawer mode="side" [opened]="sidebarOpen()">
    <mat-nav-list class="nav-items">
      @for (link of links; track link) {
      <mat-list-item [activated]="true">
        <mat-icon matListItemIcon>home</mat-icon>
        <a matListItemTitle [href]="link">{{ link }}</a>
      </mat-list-item>
      }
    </mat-nav-list>
  </mat-drawer>
  <mat-drawer-content>
    <router-outlet></router-outlet>
  </mat-drawer-content>
</mat-drawer-container>
