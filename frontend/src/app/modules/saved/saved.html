<mat-drawer-container class="h-full">
  <mat-drawer-content>
    <div class="flex flex-auto flex-col gap-4 justify-between border-b border-outline-variant px-6 py-8 sm:flex-row md:flex-col md:px-8">
      <div>
        <h1 class="text-4xl font-extrabold leading-none tracking-tight text-on-surface-variant">Saved Snippts</h1>
        <p class="text-secondary ml-0.5 font-medium">80 Snippets</p>
      </div>
      <mat-chip-set>
        <mat-chip-option>#aöldkfjöaldsf</mat-chip-option>
        <mat-chip-option>#aöldkfjöaldsf</mat-chip-option>
        <mat-chip-option>aöldkfjöaldsf</mat-chip-option>
      </mat-chip-set>
    </div>
      <mat-nav-list>
        @if(snippets$ |async; as snippets) {
          @for (snippet of snippets; track snippet.id) {
            <mat-list-item 
              [routerLink]="['./', snippet.id]" 
              routerLinkActive
              #rla="routerLinkActive"
              [activated]="rla.isActive">
              <img matListItemAvatar src="/images/avatar.png" alt="author image">
              <span matListItemTitle>{{snippet.title}}</span>
              <span matListItemLine>{{ snippet.description }}</span>
              <span matListItemLine> {{ snippet.language }} </span>
            </mat-list-item>
          }
        }
      </mat-nav-list>
  </mat-drawer-content>
  <mat-drawer mode="side" position="end" [opened]="drawerOpen$ | async">
    <router-outlet></router-outlet>
  </mat-drawer>
</mat-drawer-container>
