<div class="p-8">
  @if(snippets$ | async; as snippets) { @for(snippet of snippets; track snippet.id) {
  <mat-card class="p-3" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Chihuahua</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{snippet.content}}</p>
    </mat-card-content>
    <mat-card-footer class="example-card-footer">
      <mat-chip-set aria-label="Chihuahua traits">
        <mat-chip>charming</mat-chip>
        <mat-chip>graceful</mat-chip>
        <mat-chip>sassy</mat-chip>
      </mat-chip-set>
    </mat-card-footer>
  </mat-card>
  } } @else{
  <p>Loading ...</p>
  }
</div>
