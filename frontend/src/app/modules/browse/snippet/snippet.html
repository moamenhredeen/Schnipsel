<mat-card class="p-1" appearance="outlined">
  <mat-card-header>
    <img matCardAvatar [src]="value().author.image_url" alt="author image">
    <mat-card-title>{{value().title}}</mat-card-title>
    <mat-card-subtitle>{{value().description}}</mat-card-subtitle>
    <div class="flex-1 flex justify-end items-start">
      <div class="flex gap-1 p-1 bg-surface-container rounded-full">
        <button matIconButton [routerLink]="['/snippet/view']">
          <mat-icon>open_in_full</mat-icon>
        </button>
        <button matIconButton>
          <mat-icon>bookmark_outlined</mat-icon>
        </button>
      </div>
    </div>
  </mat-card-header>
  <mat-card-content>
    <div class="flex gap-2">
      <div class="flex flex-col items-center gap-1 p-1 bg-surface-container rounded-full self-start">
        <button matIconButton>
          <mat-icon>keyboard_arrow_up</mat-icon>
        </button>
        <span class="text-xl">10</span>
        <button matIconButton>
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
      </div>
      <pre class="bg-surface-container-low flex-1 rounded-2xl p-2"><code [innerHTML]="colorize(value().content)"></code></pre>
    </div>
  </mat-card-content>
  <mat-card-footer class="m-4">
    <mat-chip-set aria-label="Chihuahua traits">
      @for (tag of value().tags; track tag.id) {
        <mat-chip>#{{tag.name}}</mat-chip>
      }
    </mat-chip-set>
  </mat-card-footer>
</mat-card>
