spring:

  application:
    name: kakera

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  datasource:
    url: jdbc:postgresql://localhost:5432/kakeradb
    username: kakerauser
    password: kakerapassword
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.springframework.security: trace

