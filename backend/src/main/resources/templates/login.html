<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/tailwind.min.css">
    <link rel="stylesheet" href="/index.css">
    <title>Kakera - Login</title>
</head>
<body>
<main class="flex min-h-svh flex-col items-center justify-center gap-6 p-6 md:p-10">

    <div class="w-md">
        <hgroup class="text-center">
            <h1 class="text-4xl font-extrabold text-primary">Kakera</h1>
            <h3 class="text-gray-700 text-2xl font-bold">Share Code Snippets</h3>
        </hgroup>

        <form class="flex flex-col gap-4 w-md mt-8" method="post" th:action="@{/login}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="username">Username</label>
                <input class="w-full px-4 py-2 border-1 border-gray-300 focus:outline-none focus:ring-2 focus:ring-zinc-300 focus:border-transparent text-sm"
                       type="text"
                       id="username"
                       name="username"
                       placeholder="Username"
                       required
                       autofocus>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="password" >Password</label>
                <input class="w-full px-4 py-2 border-1 border-gray-300 focus:outline-none focus:ring-2 focus:ring-zinc-300 focus:border-transparent text-sm"
                       type="password"
                       id="password"
                       name="password"
                       placeholder="Password"
                       required>
            </div>

            <button class="mt-2 px-6 py-2 bg-zinc-800 text-white hover:bg-zinc-700 transition-colors text-sm font-medium cursor-pointer"
                    type="submit" >
                Sign in
            </button>
        </form>

        <div class="flex items-center gap-4 mt-4">
            <span class="bg-zinc-200 h-[1px] w-full"></span>
            <span>Or</span>
            <span class="bg-zinc-200 h-[1px] w-full"></span>
        </div>

        <div class="flex gap-4 mt-4">
            <button type="button" class="flex-1 flex items-center justify-center gap-2 border border-zinc-800 p-2 cursor-pointer hover:border-white hover:bg-zinc-800 hover:text-white transition-all text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24">
                    <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" fill="currentColor"/>
                </svg>
                Continue with Apple
            </button>

            <button class="flex-1 flex items-center justify-center gap-2 border border-zinc-800 p-2 cursor-pointer hover:border-white hover:bg-zinc-800 hover:text-white transition-all text-sm" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24">
                    <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" fill="currentColor"/>
                </svg>
                Continue with Google
            </button>
        </div>
    </div>
</main>
</body>
</html>
