<!doctype html>
<html th:replace="~{admin/layout :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Create User</title>
</head>
<body>
<main class="p-8 max-w-3xl">
    <hgroup>
        <h1 class="text-2xl font-semibold tracking-tight">Create User</h1>
        <p class="text-gray-500">Create a new user and something else</p>
    </hgroup>

    <div class="mt-6 bg-red-50 border border-red-200 rounded-lg p-4" th:if="${error}">
        <div class="flex items-start">
            <svg class="w-5 h-5 text-red-600 mt-0.5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <div>
                <h3 class="text-sm font-semibold text-red-800">Error</h3>
                <p class="mt-1 text-sm text-red-700" th:text="${error}"></p>
            </div>
        </div>
    </div>

    <div class="mt-6">
        <form action="#" th:action="@{/admin/users/create}" th:object="${user}" method="post">
            <div class="space-y-5">
                <div class="mt-4">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        Username
                    </label>
                    <input class="w-full px-4 py-2 border-1 border-gray-300 focus:outline-none focus:ring-2 focus:ring-zinc-300 focus:border-transparent text-sm"
                           type="text"
                           id="username"
                           placeholder="Enter username..."  
                           th:field="*{username}" 
                           required 
                           autofocus>
                </div>

                <div class="mt-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <input class="w-full px-4 py-2 border-1 border-gray-300 focus:outline-none focus:ring-2 focus:ring-zinc-300 focus:border-transparent text-sm"
                           id="email"
                           placeholder="bob@example.com" 
                           type="email" 
                           th:field="*{email}" 
                           required>
                </div>

                <div class="mt-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input class="w-full px-4 py-2 border-1 border-gray-300 focus:outline-none focus:ring-2 focus:ring-zinc-300 focus:border-transparent text-sm"
                           placeholder="Your strong password"
                           id="password"
                           type="password" 
                           th:field="*{password}" 
                           required>
                </div>

                <div class="mt-4">
                    <label for="roles" class="block text-sm font-medium text-gray-700 mb-2">
                        Roles
                    </label>
                    <select class="w-full px-4 py-2 border-1 border-gray-300 focus:outline-none focus:ring-2 focus:ring-zinc-300 focus:border-transparent text-sm"
                            id="roles"
                            multiple="multiple" 
                            th:field="*{roles}">
                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                    </select>
                    <p class="mt-1 text-xs text-gray-500">Hold Ctrl/Cmd to select multiple roles</p>
                </div>

                <div class="flex items-center">
                    <input class="w-4 h-4 text-zinc-600 border-gray-300 rounded focus:ring-zinc-300"
                           type="checkbox" 
                           th:field="*{enabled}" 
                           id="enabled">
                    <label for="enabled" class="ml-2 text-sm font-medium text-gray-700">
                        Enabled
                    </label>
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button class="px-6 py-2 bg-zinc-800 text-white hover:bg-zinc-700 transition-colors text-sm font-medium" type="submit">
                    Create User
                </button>
                <a class="px-6 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors text-sm font-medium decoration-none inline-flex items-center"
                   href="/admin/users">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
