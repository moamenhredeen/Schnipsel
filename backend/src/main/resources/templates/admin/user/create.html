<!doctype html>
<html th:replace="~{admin/layout :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Create User</title>
</head>
<body>
<main class="p-8 max-w-3xl">
    <hgroup>
        <h1 class="text-2xl font-semibold tracking-tight">Create User</h1>
        <p class="text-gray-500">Create a new user and something else</p>
    </hgroup>

    <div class="mt-6 bg-red-50 border border-red-200 rounded-lg p-4" th:if="${error}">
        <div class="flex items-start">
            <svg class="w-5 h-5 text-red-600 mt-0.5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <div>
                <h3 class="text-sm font-semibold text-red-800">Error</h3>
                <p class="mt-1 text-sm text-red-700" th:text="${error}"></p>
            </div>
        </div>
    </div>


    <form class="mt-6 space-y-3" action="#" th:action="@{/admin/users/create}" th:object="${user}" method="post">

        <div class="flex w-full flex-col gap-1 text-on-surface dark:text-on-surface-dark">
            <label for="username" class="w-fit pl-0.5 text-sm">Username</label>
            <input class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-75 dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark"
                   th:field="*{username}"
                   required
                   autofocus
                   id="username"
                   type="text"
                   name="username"
                   placeholder="Enter your username"/>
        </div>

        <div class="flex w-full flex-col gap-1 text-on-surface dark:text-on-surface-dark">
            <label for="email" class="w-fit pl-0.5 text-sm">Email</label>
            <input class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-75 dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark"
                   th:field="*{email}"
                   required
                   autofocus
                   id="email"
                   type="email"
                   name="email"
                   placeholder="Enter your email"/>
        </div>

        <div class="flex w-full flex-col gap-1 text-on-surface dark:text-on-surface-dark">
            <label for="password" class="w-fit pl-0.5 text-sm">Password</label>
            <input class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-75 dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark"
                   th:field="*{password}"
                   required
                   autofocus
                   id="password"
                   type="password"
                   name="password"
                   placeholder="Enter your strong password"/>
        </div>

        <div class="flex w-full flex-col gap-1 text-on-surface dark:text-on-surface-dark">
            <label for="roles" class="w-fit pl-0.5 text-sm">Roles</label>
            <select id="roles"
                    multiple="multiple"
                    th:field="*{roles}"
                    name="enabled"
                    required
                    class="w-full rounded-radius border border-outline bg-surface-alt px-4 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-75 dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark">
                <option class="p-1" th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
            </select>
        </div>

        <label for="enabled" class="flex items-center gap-2 w-fit text-sm font-medium text-on-surface dark:text-on-surface-dark has-checked:text-on-surface-strong dark:has-checked:text-on-surface-dark-strong has-disabled:cursor-not-allowed has-disabled:opacity-75">
            <span class="relative flex items-center">
                <input id="enabled"
                       type="checkbox"
                       th:field="*{enabled}"
                       class="before:content[''] peer relative size-4 appearance-none overflow-hidden rounded-none border border-outline bg-surface-alt before:absolute before:inset-0 checked:border-primary checked:before:bg-primary focus:outline-2 focus:outline-offset-2 focus:outline-outline-strong checked:focus:outline-primary active:outline-offset-0 disabled:cursor-not-allowed dark:border-outline-dark dark:bg-surface-dark-alt dark:checked:border-primary-dark dark:checked:before:bg-primary-dark dark:focus:outline-outline-dark-strong dark:checked:focus:outline-primary-dark" checked/>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" fill="none" stroke-width="4" class="pointer-events-none invisible absolute left-1/2 top-1/2 size-3 -translate-x-1/2 -translate-y-1/2 text-on-primary peer-checked:visible dark:text-on-primary-dark">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                </svg>
            </span>
            <span>Enabled</span>
        </label>

        <div class="flex justify-end gap-3">
            <a class="whitespace-nowrap rounded-radius bg-surface-alt border border-surface-alt px-4 py-2 text-sm font-medium tracking-wide text-on-surface-strong transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-surface-alt active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-surface-dark-alt dark:border-surface-dark-alt dark:text-on-surface-dark-strong dark:focus-visible:outline-surface-dark-alt"
               th:href="@{/admin/users}">
                Cancel
            </a>
            <button class="whitespace-nowrap rounded-radius bg-primary border border-primary px-4 py-2 text-sm font-medium tracking-wide text-on-primary transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-primary-dark dark:border-primary-dark dark:text-on-primary-dark dark:focus-visible:outline-primary-dark" type="submit">
                Create User
            </button>
        </div>
    </form>

</main>
</body>
</html>
