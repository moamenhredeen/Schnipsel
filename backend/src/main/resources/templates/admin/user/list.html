<!doctype html>
<html th:replace="~{admin/layout :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Users</title>
</head>

<body>
<main class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mt-4">
        <hgroup>
            <h1 class="text-2xl font-semibold tracking-tight">Users</h1>
            <p class="text-gray-500">Manage Users</p>
        </hgroup>
        <a class="px-5 py-2 bg-zinc-800 text-zinc-50 transition-colors text-sm font-medium decoration-none inline-flex items-center" href="/admin/users/create">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Create User
        </a>
    </div>
    <form class="flex gap-3 mt-8"  th:action="@{/admin/users}">
        <input class="flex-1 px-4 py-2 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-zinc-300 focus:border-transparent text-sm"
               th:value="${filter.search().orElse('')}"
               name="search"
               type="text"
               placeholder="Search users..."
               autofocus>
        <select class="px-4 py-2 border border-gray-300 bg-white focus:outline-none focus:ring-2 focus:ring-zinc-300 text-sm" name="enabled">
            <option value="">All Status</option>
            <option value="true" th:selected="${filter.enabled().orElse(false)}">Enabled</option>
            <option value="false" th:selected="${filter.enabled().orElse(false)}">Disabled</option>
        </select>
        <select class="px-4 py-2 border border-gray-300 bg-white focus:outline-none focus:ring-2 focus:ring-zinc-300 text-sm" name="roleId">
            <option value="">All Roles</option>
            <option th:each="role: ${roles}" th:value="${role.getId()}" th:selected="${role.getId().equals(filter.roleId().orElse(null))}" th:text="${role.getName()}"></option>
        </select>
        <span class="flex-1"></span>
        <button type="submit" class="cursor-pointer px-5 py-2 bg-gray-900 text-white hover:bg-gray-800 transition-colors text-sm font-medium">Search</button>
        <a class="px-5 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors text-sm font-medium decoration-none inline-flex items-center" th:href="@{/admin/users}">Reset</a>
    </form>

    <table class="w-full mt-6 bg-white border border-gray-200">
        <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Id</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                <a class="flex items-center gap-2" th:href="@{/admin/users(sort=${usernameSort})}">
                    Username
                    <svg th:if="${usernameSort.contains('desc')}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                        <path fill-rule="evenodd" d="M8 2a.75.75 0 0 1 .75.75v8.69l3.22-3.22a.75.75 0 1 1 1.06 1.06l-4.5 4.5a.75.75 0 0 1-1.06 0l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.22 3.22V2.75A.75.75 0 0 1 8 2Z" clip-rule="evenodd" />
                    </svg>
                    <svg th:if="${usernameSort.equals('')}"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                        <path fill-rule="evenodd" d="M8 14a.75.75 0 0 1-.75-.75V4.56L4.03 7.78a.75.75 0 0 1-1.06-1.06l4.5-4.5a.75.75 0 0 1 1.06 0l4.5 4.5a.75.75 0 0 1-1.06 1.06L8.75 4.56v8.69A.75.75 0 0 1 8 14Z" clip-rule="evenodd" />
                    </svg>
                </a>
            </th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Email</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Status</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Roles</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Actions</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
        <tr class="hover:bg-gray-50 transition-colors" th:each="user: ${users}">
            <td class="px-6 py-4 whitespace-nowrap">
                <a class="text-indigo-600 hover:text-indigo-800 font-medium text-sm"
                   th:href="@{/admin/users/{id}(id=${user.id()})}"
                   th:text="${user.id()}"></a>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${user.username()}"></td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700" th:text="${user.email()}"></td>
            <td class="px-6 py-4 whitespace-nowrap">
                <span th:if="${user.enabled()}" class="inline-flex items-center px-2.5 py-0.5 text-xs font-medium bg-green-50 text-green-700">Active</span>
                <span th:unless="${user.enabled()}" class="inline-flex items-center px-2.5 py-0.5 text-xs font-medium bg-gray-50 text-gray-700">Inactive</span>
            </td>
            <td class="px-6 py-4 text-sm text-gray-700" th:text="${user.roles()}"></td>
            <td class="px-6 py-4 whitespace-nowrap">
                <div class="flex gap-2">
                    <form class="w-full" th:action="@{/admin/users/edit/{id}(id=${user.id()})}" method="get">
                        <button class="w-full cursor-pointer px-3 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 transition-colors text-xs font-medium" type="submit">Edit</button>
                    </form>
                    <form class="w-full" th:action="@{/admin/users/delete/{id}(id=${user.id()})}" method="post">
                        <button class="w-full cursor-pointer px-3 py-1.5 bg-red-50 text-red-700 hover:bg-red-100 transition-colors text-xs font-medium" type="submit">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="flex justify-end mt-6">
        <ul class="list-none p-0 flex items-center gap-2 text-gray-900">
            <li>
                <a th:href="@{/admin/users(page=${users.previousOrFirstPageable().pageNumber})}"
                   class="flex items-center justify-center w-9 h-9 border border-gray-300 transition-colors hover:bg-gray-50 rtl:rotate-180"
                   aria-label="Previous page">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                    </svg>
                </a>
            </li>

            <li class="px-3 text-sm font-medium text-gray-700" th:text="${users.getNumber() + 1} + ' / ' + ${users.getTotalPages()}">2/12</li>

            <li>
                <a th:href="@{/admin/users(page=${users.nextOrLastPageable().pageNumber})}"
                   class="flex items-center justify-center w-9 h-9 border border-gray-300 transition-colors hover:bg-gray-50 rtl:rotate-180"
                   aria-label="Next page">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                    </svg>
                </a>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
