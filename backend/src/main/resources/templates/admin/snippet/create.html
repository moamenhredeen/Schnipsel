<!doctype html>
<html th:replace="~{admin/layout :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Create Snippet</title>
</head>
<body>
<main class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-semibold tracking-tight">Create New Snippet</h1>

    <div class="mt-6 bg-red-50 border border-red-200 rounded-lg p-4" th:if="${error}">
        <div class="flex items-start">
            <svg class="w-5 h-5 text-red-600 mt-0.5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <div>
                <h3 class="text-sm font-semibold text-red-800">Error</h3>
                <p class="mt-1 text-sm text-red-700" th:text="${error}"></p>
            </div>
        </div>
    </div>

    <div class="mt-6 bg-white rounded-xl border border-gray-200 shadow p-6">
        <form action="#" th:action="@{/admin/snippets/create}" th:object="${snippet}" method="post">
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Title
                    </label>
                    <input class="box-border w-full px-4 py-2 rounded-lg border-1 border-solid border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm" 
                           type="text" 
                           placeholder="Enter snippet title"  
                           th:field="*{title}" 
                           required 
                           autofocus>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Description
                    </label>
                    <input class="box-border w-full px-4 py-2 rounded-lg border-1 border-solid border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm" 
                           placeholder="What is this snippet about" 
                           type="text" 
                           th:field="*{description}" 
                           required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Language
                    </label>
                    <input class="box-border w-full px-4 py-2 rounded-lg border-1 border-solid border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm" 
                           placeholder="Programming language (e.g., Java, Python)" 
                           type="text" 
                           th:field="*{language}" 
                           required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Content
                    </label>
                    <textarea rows="15"
                              class="box-border w-full px-4 py-2 rounded-lg border-1 border-solid border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm font-mono" 
                              placeholder="Your code goes here, have fun :)" 
                              th:field="*{content}" 
                              required></textarea>
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button class="border-none px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-sm font-medium" type="submit">
                    Create Snippet
                </button>
                <a class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium decoration-none inline-flex items-center" 
                   href="/admin/snippets">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
