<!doctype html>
<html th:replace="~{admin/layout :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Snippet</title>
</head>
<body>
<main>

    <article class="pico-background-red-50" th:if="${error}">
        <header class="pico-background-red-200">Error</header>
        <span th:text="${error}"></span>
    </article>

        <h1>Create a new User</h1>
        <form class="max-w-200" action="#" th:action="@{/admin/snippets/create}" th:object="${snippet}" method="post">
            <label class="flex flex-col gap-1 mt-6">
                Title
                <input class="p-2" type="text" placeholder="enter snippet title"  th:field="*{title}" required autofocus>
            </label>

            <label class="flex flex-col gap-1 mt-6">
                Description
                <input class="p-2" placeholder="what is this snippet about" type="text" th:field="*{description}" required>
            </label>

            <label class="flex flex-col gap-1 mt-6">
                Language
                <input class="p-2" placeholder="the programming language the description is written in" type="text" th:field="*{language}" required>
            </label>

            <label class="flex flex-col gap-1 mt-6">
                Content
                <textarea rows="20" class="p-2" placeholder="your code goes here, have fun :)" th:field="*{content}" required></textarea>
            </label>

            <button class="mt-6 w-24 p-2 bg-zinc-800 text-white border-none cursor-pointer" type="submit">Save</button>
        </form>
</main>
</body>
</html>
