<!doctype html>
<html th:replace="~{admin/layout :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Create Role</title>
</head>
<body>

<main class="p-8 max-w-3xl">
    <hgroup>
        <h1 class="text-2xl font-semibold tracking-tight">Create Role</h1>
        <p class="text-gray-500">Create a new role and something else</p>
    </hgroup>

    <div class="mt-6 bg-red-50 border border-red-200 rounded-lg p-4" th:if="${error}">
        <div class="flex items-start">
            <svg class="w-5 h-5 text-red-600 mt-0.5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <div>
                <h3 class="text-sm font-semibold text-red-800">Error</h3>
                <p class="mt-1 text-sm text-red-700" th:text="${error}"></p>
            </div>
        </div>
    </div>


    <form class="mt-6 space-y-3" action="#" th:action="@{/admin/users/create}" th:object="${role}" method="post">

        <div class="flex w-full flex-col gap-1 text-on-surface dark:text-on-surface-dark">
            <label for="name" class="w-fit pl-0.5 text-sm">Role Name</label>
            <input class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-75 dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark"
                   th:field="*{name}"
                   required
                   autofocus
                   id="name"
                   type="text"
                   name="name"
                   placeholder="Enter role name"/>
        </div>

        <div class="flex justify-end gap-3">
            <a class="whitespace-nowrap rounded-radius bg-surface-alt border border-surface-alt px-4 py-2 text-sm font-medium tracking-wide text-on-surface-strong transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-surface-alt active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-surface-dark-alt dark:border-surface-dark-alt dark:text-on-surface-dark-strong dark:focus-visible:outline-surface-dark-alt"
               th:href="@{/admin/roles}">
                Cancel
            </a>
            <button class="whitespace-nowrap rounded-radius bg-primary border border-primary px-4 py-2 text-sm font-medium tracking-wide text-on-primary transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-primary-dark dark:border-primary-dark dark:text-on-primary-dark dark:focus-visible:outline-primary-dark" type="submit">
                Create Role
            </button>
        </div>
    </form>

</main>
